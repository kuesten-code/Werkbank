name: kuestencode_faktura

services:
  postgres:
    image: postgres:16
    container_name: kuestencode_postgres_dev
    environment:
      POSTGRES_DB: kuestencode_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kuestencode_network_dev

  host:
    build:
      context: .
      dockerfile: src/Host/Dockerfile
    container_name: kuestencode_host_dev
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=kuestencode_dev;Username=postgres;Password=dev_password
      - ServiceUrls__Faktura=http://faktura:8081
      - ServiceUrls__Rapport=http://rapport:8082
      - ServiceUrls__Offerte=http://offerte:8083
      - ServiceUrls__Acta=http://acta:8084
      - ServiceUrls__Recepta=http://recepta:8085
      - ServiceUrls__Saldo=http://saldo:8086
      - APPLY_MIGRATIONS=true
      - Backup__SourcePath=/app/backup-source
    volumes:
      # Kompletter eigener Datenordner (Keys, JWT-Secret, ...) - ohne diesen Mount wird bei
      # jedem Neustart u.a. ein neues JWT-Secret generiert und alle Logins werden ungültig.
      - ./data:/app/data
      # Derselbe Ordner nochmal unter anderem Pfad für die Backup-Funktionalität im Host: der
      # komplette Datenbaum aller Module (Postgres, Uploads, Keys) als Backup-Quelle.
      - ./data:/app/backup-source
      # Separater Ordner außerhalb von ./data für das "Lokal"-Backup-Ziel beim Testen -
      # sonst würde jedes Backup die vorherigen Backups aus ./data gleich mit einpacken.
      - ./backups-local-test:/app/backup-target
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kuestencode_network_dev

  faktura:
    build:
      context: .
      dockerfile: src/Modules/Faktura/Dockerfile
    container_name: kuestencode_faktura_dev
    ports:
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8081
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=kuestencode_dev;Username=postgres;Password=dev_password
      - ServiceUrls__Host=http://host:8080
      - ServiceUrls__Self=http://faktura:8081
      - APPLY_MIGRATIONS=true
      - DEMO_SEED=true
    volumes:
      - ./data/keys:/app/data/keys
    depends_on:
      postgres:
        condition: service_healthy
      host:
        condition: service_started
    restart: unless-stopped
    networks:
      - kuestencode_network_dev

  rapport:
    build:
      context: .
      dockerfile: src/Modules/Rapport/Dockerfile
    container_name: kuestencode_rapport_dev
    ports:
      - "8082:8082"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8082
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=kuestencode_dev;Username=postgres;Password=dev_password
      - ServiceUrls__Host=http://host:8080
      - ServiceUrls__Self=http://rapport:8082
      - APPLY_MIGRATIONS=true
    volumes:
      - ./data/keys:/app/data/keys
    depends_on:
      postgres:
        condition: service_healthy
      host:
        condition: service_started
    restart: unless-stopped
    networks:
      - kuestencode_network_dev

  offerte:
    build:
      context: .
      dockerfile: src/Modules/Offerte/Kuestencode.Werkbank.Offerte/Dockerfile
    container_name: kuestencode_offerte_dev
    ports:
      - "8083:8083"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8083
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=kuestencode_dev;Username=postgres;Password=dev_password
      - ServiceUrls__Host=http://host:8080
      - ServiceUrls__Self=http://offerte:8083
      - APPLY_MIGRATIONS=true
    volumes:
      - ./data/keys:/app/data/keys
    depends_on:
      postgres:
        condition: service_healthy
      host:
        condition: service_started
    restart: unless-stopped
    networks:
      - kuestencode_network_dev
      
  acta:
    build:
      context: .
      dockerfile: src/Modules/Acta/Kuestencode.Werkbank.Acta/Dockerfile
    container_name: kuestencode_acta_dev
    ports:
      - "8084:8084"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8084
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=kuestencode_dev;Username=postgres;Password=dev_password
      - ServiceUrls__Host=http://host:8080
      - ServiceUrls__Self=http://acta:8084
      - ServiceUrls__Rapport=http://rapport:8082
      - ServiceUrls__Recepta=http://recepta:8085
      - ServiceUrls__Faktura=http://faktura:8081
      - APPLY_MIGRATIONS=true
    volumes:
      - ./data/keys:/app/data/keys
    depends_on:
      postgres:
        condition: service_healthy
      host:
        condition: service_started
    restart: unless-stopped
    networks:
      - kuestencode_network_dev

  recepta:
    build:
      context: .
      dockerfile: src/Modules/Recepta/Kuestencode.Werkbank.Recepta/Dockerfile
    container_name: kuestencode_recepta_dev
    ports:
      - "8085:8085"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8085
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=kuestencode_dev;Username=postgres;Password=dev_password
      - ServiceUrls__Host=http://host:8080
      - ServiceUrls__Self=http://recepta:8085
      - APPLY_MIGRATIONS=true
      - DEMO_SEED=true
    volumes:
      - ./data/recepta:/app/data
      - ./data/keys:/app/data/keys
    depends_on:
      postgres:
        condition: service_healthy
      host:
        condition: service_started
    restart: unless-stopped
    networks:
      - kuestencode_network_dev

  saldo:
    build:
      context: .
      dockerfile: src/Modules/Saldo/Kuestencode.Werkbank.Saldo/Dockerfile
    container_name: kuestencode_saldo_dev
    ports:
      - "8086:8086"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8086
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=kuestencode_dev;Username=postgres;Password=dev_password
      - ServiceUrls__Host=http://host:8080
      - ServiceUrls__Self=http://saldo:8086
      - ServiceUrls__Faktura=http://faktura:8081
      - ServiceUrls__Recepta=http://recepta:8085
      - APPLY_MIGRATIONS=true
    volumes:
      - ./data/keys:/app/data/keys
    depends_on:
      postgres:
        condition: service_healthy
      host:
        condition: service_started
    restart: unless-stopped
    networks:
      - kuestencode_network_dev


  sftp-test:
    image: atmoz/sftp:latest
    container_name: werkbank_sftp_test
    profiles: ["backup-test"]
    ports:
      - "2222:22"
    volumes:
      - ./backups-sftp-test:/home/backupuser/backups
    command: backupuser:backuppass:1001:1001:backups
    networks:
      - kuestencode_network_dev

  minio-test:
    image: quay.io/minio/minio
    container_name: werkbank_minio_test
    profiles: ["backup-test"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=backupadmin
      - MINIO_ROOT_PASSWORD=backuppassword
    command: server /data --console-address ":9001"
    volumes:
      - ./backups-minio-test:/data
    networks:
      - kuestencode_network_dev

  # Legt automatisch einen Bucket an, damit du in der UI nicht erst per mc/Console ran musst.
  minio-test-init:
    image: quay.io/minio/mc
    container_name: werkbank_minio_test_init
    profiles: ["backup-test"]
    depends_on:
      - minio-test
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio-test:9000 backupadmin backuppassword; do sleep 1; done;
      mc mb -p local/werkbank-backup-test;
      exit 0;
      "
    networks:
      - kuestencode_network_dev

  webdav-test:
    image: rclone/rclone
    container_name: werkbank_webdav_test
    profiles: ["backup-test"]
    ports:
      - "8888:8888"
    volumes:
      - ./backups-webdav-test:/data
    command: serve webdav /data --addr :8888 --user backupuser --pass backuppass
    networks:
      - kuestencode_network_dev

networks:
  kuestencode_network_dev:
    driver: bridge
