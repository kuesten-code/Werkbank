name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore Kuestencode.Werkbank.sln

      - name: Run tests
        run: dotnet test Kuestencode.Werkbank.sln --configuration Release --no-restore --logger "trx" --results-directory TestResults

      - name: Publish test summary
        if: always()
        run: |
          {
            echo "## Testergebnisse"
            echo
            echo "| Projekt | Gesamt | Bestanden | Fehlgeschlagen |"
            echo "|---|---|---|---|"
            total_all=0; passed_all=0; failed_all=0
            for trx in TestResults/*.trx; do
              storage=$(grep -oE 'storage="[^"]*"' "$trx" | head -1 | sed -E 's/storage="([^"]*)"/\1/')
              name=$(basename "${storage//\\//}" .dll)
              total=$(grep -oE 'total="[0-9]+"' "$trx" | head -1 | sed -E 's/total="([0-9]+)"/\1/')
              passed=$(grep -oE 'passed="[0-9]+"' "$trx" | head -1 | sed -E 's/passed="([0-9]+)"/\1/')
              failed=$(grep -oE 'failed="[0-9]+"' "$trx" | head -1 | sed -E 's/failed="([0-9]+)"/\1/')
              total=${total:-0}; passed=${passed:-0}; failed=${failed:-0}
              echo "| $name | $total | $passed | $failed |"
              total_all=$((total_all + total))
              passed_all=$((passed_all + passed))
              failed_all=$((failed_all + failed))
            done
            echo "| **Gesamt** | **$total_all** | **$passed_all** | **$failed_all** |"

            if [ "$failed_all" -gt 0 ]; then
              echo
              echo "### ❌ Fehlgeschlagene Tests"
              for trx in TestResults/*.trx; do
                grep -E 'outcome="Failed"' "$trx" | grep -oE 'testName="[^"]*"' | sed -E 's/testName="([^"]*)"/- \1/'
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 7

  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build_matrix: ${{ steps.set-matrix.outputs.build_matrix }}
      merge_matrix: ${{ steps.set-matrix.outputs.merge_matrix }}
      has_modules: ${{ steps.set-matrix.outputs.has_modules }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read VERSION file and create matrices
        id: set-matrix
        run: |
          declare -A DOCKERFILES
          DOCKERFILES[host]="src/Host/Dockerfile"
          DOCKERFILES[faktura]="src/Modules/Faktura/Dockerfile"
          DOCKERFILES[rapport]="src/Modules/Rapport/Dockerfile"
          DOCKERFILES[offerte]="src/Modules/Offerte/Kuestencode.Werkbank.Offerte/Dockerfile"
          DOCKERFILES[acta]="src/Modules/Acta/Kuestencode.Werkbank.Acta/Dockerfile"
          DOCKERFILES[recepta]="src/Modules/Recepta/Kuestencode.Werkbank.Recepta/Dockerfile"
          DOCKERFILES[saldo]="src/Modules/Saldo/Kuestencode.Werkbank.Saldo/Dockerfile"

          BUILD_MATRIX='{"include":['
          MERGE_MATRIX='{"include":['
          BUILD_FIRST=true
          MERGE_FIRST=true

          while IFS='=' read -r module version || [ -n "$module" ]; do
            [[ -z "$module" || "$module" =~ ^# ]] && continue
            module=$(echo "$module" | xargs)
            version=$(echo "$version" | xargs)
            [[ -z "$version" ]] && continue
            [[ -z "${DOCKERFILES[$module]}" ]] && continue

            image="ghcr.io/${{ github.repository_owner }}/${module}:${version}"
            if docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
              echo "Skip $module: $version bereits veröffentlicht ($image)"
              continue
            fi

            echo "Build $module: $version ist neu"
            dockerfile="${DOCKERFILES[$module]}"

            for platform in "linux/amd64" "linux/arm64"; do
              arch="${platform##*/}"
              [ "$BUILD_FIRST" = true ] && BUILD_FIRST=false || BUILD_MATRIX+=','
              BUILD_MATRIX+="{\"module\":\"$module\",\"version\":\"$version\",\"dockerfile\":\"$dockerfile\",\"platform\":\"$platform\",\"arch\":\"$arch\"}"
            done

            [ "$MERGE_FIRST" = true ] && MERGE_FIRST=false || MERGE_MATRIX+=','
            MERGE_MATRIX+="{\"module\":\"$module\",\"version\":\"$version\"}"
          done < VERSION

          BUILD_MATRIX+=']}'
          MERGE_MATRIX+=']}'

          echo "build_matrix=$BUILD_MATRIX" >> $GITHUB_OUTPUT
          echo "merge_matrix=$MERGE_MATRIX" >> $GITHUB_OUTPUT

          if [ "$MERGE_FIRST" = true ]; then
            echo "has_modules=false" >> $GITHUB_OUTPUT
          else
            echo "has_modules=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.module }} (${{ matrix.arch }}) v${{ matrix.version }}
    runs-on: ubuntu-latest
    needs: [test, prepare]
    if: needs.prepare.outputs.has_modules == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.module }},push-by-digest=true,name-canonical=true
          build-args: |
            DOCKER_IMAGE_TAG=${{ matrix.version }}
          cache-from: type=gha,scope=${{ matrix.module }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.module }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge ${{ matrix.module }} v${{ matrix.version }}
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.has_modules == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.merge_matrix) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.module }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.module }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.module }}
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=latest

      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.module }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.module }}:${{ matrix.version }}
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/${{ matrix.module }}:${{ matrix.version }}
